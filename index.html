<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffd8e8">
  <title>One Two Three – Lyna vs SinH</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span>🌸</span> One Two Three <small>Lyna vs SinH</small></div>
      <button id="soundBtn" class="icon-btn" type="button" aria-label="Tắt âm thanh" aria-pressed="true">🔊</button>
    </header>

    <section class="scoreboard" aria-label="Bảng điểm">
      <div class="score lyna-score"><span>LYNA</span><strong id="lynaScore">0</strong></div>
      <div class="versus">VS</div>
      <div class="score sinh-score"><strong id="sinhScore">0</strong><span>SINH</span></div>
    </section>

    <section class="playground" id="playground">
      <div class="sky-decor" aria-hidden="true">
        <div class="sun"></div><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div>
        <div class="tree"><i></i><b></b></div>
        <div class="fence"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>

      <div id="countdown" class="countdown" aria-live="assertive"></div>
      <div id="result" class="result" aria-live="polite">Sẵn sàng chưa?</div>

      <div class="characters">
        <div class="player-wrap lyna-wrap">
          <div id="lynaBubble" class="speech">SinH ngu 😝</div>
          <div id="lyna" class="character lyna" data-action="idle" aria-label="Nhân vật Lyna">
            <div class="hand-sign" aria-hidden="true">✊<small>BÚA</small></div>
            <div class="bow"><i></i></div>
            <div class="hair hair-back"></div>
            <div class="head"><div class="bang"></div><div class="face"><i class="eye left"></i><i class="eye right"></i><b class="mouth"></b></div></div>
            <div class="arm arm-left"></div><div class="arm arm-right"></div>
            <div class="body"><div class="dress-top"></div><div class="skirt"></div></div>
            <div class="leg leg-left"></div><div class="leg leg-right"></div>
          </div>
          <div class="name-tag pink">Lyna</div>
        </div>

        <div class="player-wrap sinh-wrap">
          <div id="sinhBubble" class="speech sinh-speech">Ơ... 😵‍💫</div>
          <div id="sinh" class="character sinh" data-action="idle" aria-label="Nhân vật SinH">
            <div class="hand-sign" aria-hidden="true">✊<small>BÚA</small></div>
            <div class="hair-boy"></div>
            <div class="head"><div class="face"><i class="eye left"></i><i class="eye right"></i><b class="mouth"></b></div></div>
            <div class="arm arm-left"></div><div class="arm arm-right"></div>
            <div class="body"><div class="shirt"></div><div class="shorts"></div></div>
            <div class="leg leg-left"></div><div class="leg leg-right"></div>
          </div>
          <div class="name-tag blue">SinH</div>
        </div>
      </div>

      <div id="particles" class="particles" aria-hidden="true"></div>
      <div class="grass"><i></i><i></i><i></i><i></i><i></i></div>
    </section>

    <section class="controls">
      <button id="startBtn" class="main-btn" type="button">▶ Bắt đầu</button>
      <button id="replayBtn" class="secondary-btn" type="button" disabled>↻ Chơi lại</button>
    </section>
    <p class="hint">“One, two, three — ra cái gì? Ra cái này!”</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
